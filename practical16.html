
<!DOCTYPE html>
<html>
<head>
    <title>Student Marks Calculator</title>
</head>
<body>

    <h1>Student Marks Calculator</h1>

    <label>Student Name:</label>
    <input type="text" id="name">
    <br><br>

    <label>Subject 1:</label>
    <input type="number" id="m1" min="0" max="100">
    <br><br>

    <label>Subject 2:</label>
    <input type="number" id="m2" min="0" max="100">
    <br><br>

    <label>Subject 3:</label>
    <input type="number" id="m3" min="0" max="100">
    <br><br>

    <label>Subject 4:</label>
    <input type="number" id="m4" min="0" max="100">
    <br><br>

    <label>Subject 5:</label>
    <input type="number" id="m5" min="0" max="100">
    <br><br>

    <button onclick="calculateResult()">Calculate Result</button>

    <h2>Result</h2>

    <p id="result"></p>

    <script>
        function calculateResult() {

            var name = document.getElementById("name").value;

            var m1 = Number(document.getElementById("m1").value);
            var m2 = Number(document.getElementById("m2").value);
            var m3 = Number(document.getElementById("m3").value);
            var m4 = Number(document.getElementById("m4").value);
            var m5 = Number(document.getElementById("m5").value);

            if (
                name == "" ||
                document.getElementById("m1").value == "" ||
                document.getElementById("m2").value == "" ||
                document.getElementById("m3").value == "" ||
                document.getElementById("m4").value == "" ||
                document.getElementById("m5").value == ""
            ) {
                alert("Please enter all details.");
                return;
            }

            if (
                m1 < 0 || m1 > 100 ||
                m2 < 0 || m2 > 100 ||
                m3 < 0 || m3 > 100 ||
                m4 < 0 || m4 > 100 ||
                m5 < 0 || m5 > 100
            ) {
                alert("Enter marks between 0 and 100.");
                return;
            }

            var total = m1 + m2 + m3 + m4 + m5;
            var percentage = total / 5;
            var grade;

            if (percentage >= 80) {
                grade = "A";
            }
            else if (percentage >= 60) {
                grade = "B";
            }
            else if (percentage >= 40) {
                grade = "C";
            }
            else {
                grade = "Fail";
            }

            document.getElementById("result").innerHTML =
                "Student Name: " + name +
                "<br>Total Marks: " + total + " / 500" +
                "<br>Percentage: " + percentage + "%" +
                "<br>Grade: " + grade;
        }
    </script>

</body>
</html>

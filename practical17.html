
<!DOCTYPE html>
<html>
<head>
    <title>Student Eligibility Checker</title>
</head>
<body>

    <h1>Student Eligibility Checker</h1>

    <label>Student Name:</label>
    <input type="text" id="name">
    <br><br>

    <label>Student Age:</label>
    <input type="number" id="age">
    <br><br>

    <label>Percentage:</label>
    <input type="number" id="percentage">
    <br><br>

    <button onclick="checkEligibility()">Check Eligibility</button>

    <h2 id="result"></h2>

    <script>
        function checkEligibility() {

            var name = document.getElementById("name").value;
            var age = Number(document.getElementById("age").value);
            var percentage = Number(document.getElementById("percentage").value);

            if (name == "" || document.getElementById("age").value == "" ||
                document.getElementById("percentage").value == "") {

                alert("Please enter all details.");
                return;
            }

            if (age < 1 || percentage < 0 || percentage > 100) {
                alert("Please enter valid details.");
                return;
            }

            if (age >= 18 && percentage >= 50) {
                document.getElementById("result").innerHTML =
                    name + " is Eligible.";
            }
            else {
                document.getElementById("result").innerHTML =
                    name + " is Not Eligible.";
            }
        }
    </script>

</body>
</html>

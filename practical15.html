
<!DOCTYPE html>
<html>
<head>
    <title>Product Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
        }

        header {
            background-color: navy;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .product {
            width: 300px;
            background-color: white;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 4px 10px gray;
            transition: transform 0.3s;
        }

        .product:hover {
            transform: scale(1.05);
        }

        .product img {
            width: 200px;
            height: 150px;
            object-fit: contain;
        }

        .price {
            color: green;
            font-size: 22px;
            font-weight: bold;
        }

        button {
            background-color: navy;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: green;
        }
    </style>
</head>

<body>

    <header>
        <h1>My Product Store</h1>
        <p>Best Products at Best Prices</p>
    </header>

    <div class="product">

        <img src="https://placehold.co/200x150?text=Headphones"
            alt="Headphones">

        <h2>Wireless Headphones</h2>

        <p>Enjoy high-quality sound with wireless headphones.</p>

        <p class="price">₹999</p>

        <button>Buy Now</button>

    </div>

</body>
</html>
